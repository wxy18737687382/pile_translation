[project]
name = "pile-translation"
version = "0.2.1"
description = "Academic Paper Translation Pipeline (MinerU + 1:1 Side-by-Side Bilingual Overlay)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "wxy18737687382" }
]
keywords = [
    "academic-translation",
    "pdf-translation",
    "mineru",
    "deepseek",
    "side-by-side",
    "latex",
    "bilingual"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
    "openai>=1.40.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "python-docx>=1.0.0",
    "pillow>=10.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
unimernet = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
pile-translate = "pipeline.cli:main"
paper-trans = "pipeline.cli:main"

[project.urls]
Homepage = "https://github.com/wxy18737687382/pile_translation"
Repository = "https://github.com/wxy18737687382/pile_translation.git"
Issues = "https://github.com/wxy18737687382/pile_translation/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.hatch.build.targets.sdist]
include = [
    "/pipeline",
    "/services",
    "/README.md",
    "/pyproject.toml",
    "/requirements.txt",
    "/main.py",
]
